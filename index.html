<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GBA</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body { overflow: hidden; background: #000; margin: 0; }
    #startButton {
      display: block; width: 160px; height: 40px; margin: 20px auto;
      background: #4caf50; color: #fff; font-size: 16px; border: none;
      border-radius: 8px; cursor: pointer; font-family: "Press Start 2P", cursive;
    }
  </style>
</head>
<body>
  <div style="width:100vw; height:100vh; max-width:100%">
    <div id="game" style="display:none"></div>
    <button id="startButton">PLAY</button>
  </div>
  <script>
    document.getElementById("startButton").addEventListener("click", function () {
      document.getElementById("game").style.display = "block";
      this.style.display = "none";
      EJS_player = "#game";
      EJS_core = "gba";
      EJS_color = "#000000";
      EJS_startOnLoaded = true;
      EJS_pathtodata = "./";
      EJS_gameUrl = "game.gba";
      var s = document.createElement("script");
      s.src = "loader.js";
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
